name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # The app at https://<user>.github.io/<repo>/ — pair it with OpenCode's
  # remote tunnel or Tailscale (an https page cannot call http LAN addresses).
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # The downloadable app: one self-contained HTML file on GitHub Releases.
  # A user downloads it, double-clicks it, and connects to their own
  # `opencode serve --hostname 0.0.0.0 --cors null`.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build:single
        working-directory: client
      - run: mv client/dist-single/index.html agentlink.html
      - uses: softprops/action-gh-release@v2
        with:
          files: agentlink.html
