<script>
(function () {
  try {
    if (localStorage.getItem("agentlink.phoneHintDismissed")) return
    fetch("/_agentlink/info")
      .then(function (r) { return r.ok ? r.json() : null })
      .then(function (info) {
        if (!info || !info.phoneUrl) return
        var d = document.createElement("div")
        d.style.cssText = "position:fixed;right:14px;bottom:14px;z-index:9999;background:#fff;border:1px solid #d8d8d8;border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-family:system-ui,sans-serif;font-size:13px;color:#222;max-width:230px"
        d.innerHTML =
          '<div style="font-weight:700;margin-bottom:8px">Pair your phone</div>' +
          '<img src="/_agentlink/qr.svg" style="width:150px;height:150px;display:block" alt="QR">' +
          '<div style="margin:8px 0;word-break:break-all"><a href="' + info.phoneUrl + '">Open the link</a></div>' +
          '<button style="width:100%;padding:6px;border:1px solid #ccc;border-radius:8px;background:#f4f4f4;cursor:pointer">Dismiss</button>'
        d.querySelector("button").onclick = function () {
          try { localStorage.setItem("agentlink.phoneHintDismissed", "1") } catch (e) {}
          d.remove()
        }
        document.body.appendChild(d)
      })
      .catch(function () {})
  } catch (e) {}
})()
</script>
